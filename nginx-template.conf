# Nginx Reverse Proxy Configuration for Sanaei Bridge Panel & API
# Place in: /etc/nginx/conf.d/sanaei-bridge.conf

server {
    listen 80;
    server_name api.yourdomain.com; # دامنه اختصاصی خود را وارد کنید

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.yourdomain.com; # دامنه اختصاصی خود را وارد کنید

    # SSL Certificates (Issued by Certbot or Cloudflare)
    ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Allow large APK uploads (up to 200MB)
    client_max_body_size 200M;

    # Proxy to Sanaei Bridge Node.js app
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for streaming/long-polling and APK building
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
